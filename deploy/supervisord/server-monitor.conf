; Fragment konfiguracji supervisord (np. /etc/supervisor/conf.d/server-monitor.conf
; lub w sekcji głównej supervisord.conf). Demon odpytuje XML-RPC po tym gnieździe
; jako użytkownik `monitor` (grupa monitor) — bez sudo i bez supervisorctl.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:monitor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
