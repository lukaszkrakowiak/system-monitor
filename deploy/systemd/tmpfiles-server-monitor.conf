# /usr/lib/tmpfiles.d/server-monitor.conf
# setgid + grupa monitor: pliki -wal/-shm utworzone przez `ingest-pam` (pam_exec, root)
# dziedziczą grupę monitor i uprawnienia pliku bazy (0660), więc demon (monitor) nadal je zapisuje.
d /var/lib/server-monitor 2770 monitor monitor -
d /etc/server-monitor     0750 root    monitor -
